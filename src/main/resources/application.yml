spring:
  application:
    name: wallet-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: wallet-service

# Bearer-token -> user mapping. Auth sophistication is explicitly NOT graded;
# this is a minimal-but-real static token map, overridable via env.
# Format: token1:user1,token2:user2
wallet:
  auth:
    tokens: ${AUTH_TOKENS:tok_alice:alice,tok_bob:bob,tok_carol:carol}
